# PRIVATE — Electronics deal pipeline. EXTENDS base_deal_pipeline: every shared member
# (deal_id, status, stages, won/lost/open measures, win rate, avg days to close) is inherited,
# so the three product lines stay symmetric by construction. Only what is specific to
# Electronics is declared here.
cubes:
  - name: base_operational_electronics
    extends: base_deal_pipeline
    sql_table: {{ table('mart_electronics', 'deal_pipeline') }}
    public: false
    description: "Esteira de negócios de Eletrônicos, no grão de negócio. Herda o esqueleto comum de pipeline e acrescenta o que é específico da linha."

    dimensions:
      - name: is_bundle
        sql: is_bundle
        type: boolean
        title: "É combo"
        description: "TRUE quando o negócio é um combo de itens — específico de eletrônicos, onde o combo tem margem diferente do item avulso. Boolean."
      - name: trade_in_value
        sql: trade_in_value
        type: number
        title: "Valor de troca"
        description: "Valor abatido por equipamento entregue na troca. Numérico."
