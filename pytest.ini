[pytest]
# Tests drive a RUNNING Cube instance (docker compose up) over its REST API.
# The warehouse tier additionally reads warehouse/meridian.duckdb directly.
pythonpath = tests tests/contract
testpaths = tests
addopts = -ra -q
markers =
    contract: compile, governance, RBAC/RLS, modelling features — needs Cube up, no warehouse
    smoke: every measure/segment/time dimension answers — needs Cube up AND a warehouse
    fanout: a joined dimension never inflates an additive total — needs Cube up AND a warehouse
    warehouse: parity against the source + PK uniqueness — reads the local DuckDB directly
