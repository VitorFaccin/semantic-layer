# House Python style, codified so the standard is checkable rather than remembered.
# 100 columns: wide enough for typed signatures and Google-style docstrings without
# forcing awkward wraps, narrow enough for side-by-side diffs.
line-length = 100
target-version = "py310"

[lint]
# E/W  pycodestyle (PEP 8)      F   pyflakes (real bugs)
# I    import order             UP  pyupgrade (modern syntax)
# ANN  missing type annotations D   docstring presence/format
select = ["E", "W", "F", "I", "UP", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211 (blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary on the first line)
    "ANN401",  # allow typing.Any where a payload is genuinely untyped JSON
]

[lint.per-file-ignores]
# Test modules document intent in the function name and the docstring body; the fixtures
# they receive are pytest machinery, already typed in the signature.
"tests/**" = ["D103", "D100"]
"mcp_gateway/tests/**" = ["D103", "D100"]

[lint.pydocstyle]
convention = "google"
