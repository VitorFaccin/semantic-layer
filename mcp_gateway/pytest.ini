[pytest]
# `pytest` and `python -m pytest` do NOT behave the same: the module form prepends the current
# directory to sys.path, the executable does not. Without this, `pytest tests` from here fails
# with "No module named 'app'" while `python -m pytest tests` passes — which is exactly how a
# green local run turns into a red CI run.
pythonpath = .
testpaths = tests
addopts = -ra -q
